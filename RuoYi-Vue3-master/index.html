<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="/favicon.ico">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    /* ===== 首屏加载页：深色科技蓝 ===== */
    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(150deg, #050b1a, #0a1c3a 50%, #061325);
    }

    /* 背景装饰层 */
    #loader-wrapper .loader-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #loader-wrapper .loader-grid {
      position: absolute;
      inset: -40px;
      background-image:
        linear-gradient(rgba(59, 169, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 169, 255, 0.07) 1px, transparent 1px);
      background-size: 42px 42px;
      -webkit-animation: gridMove 16s linear infinite;
      animation: gridMove 16s linear infinite;
    }

    #loader-wrapper .loader-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      -webkit-animation: breathe 6s ease-in-out infinite;
      animation: breathe 6s ease-in-out infinite;
    }

    #loader-wrapper .glow-a {
      width: 460px; height: 460px; top: -160px; right: -120px;
      background: rgba(59, 169, 255, 0.18);
    }

    #loader-wrapper .glow-b {
      width: 400px; height: 400px; bottom: -140px; left: -120px;
      background: rgba(77, 208, 255, 0.12);
      -webkit-animation-delay: 2.4s;
      animation-delay: 2.4s;
    }

    /* 旋转霓虹光环 */
    #loader-wrapper .loader-core {
      position: relative;
      width: 130px;
      height: 130px;
      z-index: 2;
    }

    #loader-wrapper .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, rgba(77, 208, 255, 0.15) 25%, #4dd0ff 55%, #3ba9ff 78%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
      filter: drop-shadow(0 0 10px rgba(77, 208, 255, 0.7));
      -webkit-animation: spin 1.4s linear infinite;
      animation: spin 1.4s linear infinite;
    }

    #loader-wrapper .loader-ring.inner {
      inset: 22px;
      background: conic-gradient(from 180deg, transparent 0%, rgba(59, 169, 255, 0.15) 30%, #3ba9ff 65%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
      filter: drop-shadow(0 0 8px rgba(59, 169, 255, 0.6));
      -webkit-animation: spin 2.2s linear infinite reverse;
      animation: spin 2.2s linear infinite reverse;
    }

    #loader-wrapper .loader-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
      border-radius: 50%;
      background: radial-gradient(circle, #eaf6ff, #4dd0ff 60%, transparent 75%);
      box-shadow: 0 0 16px rgba(77, 208, 255, 0.9);
      -webkit-animation: pulse 1.6s ease-in-out infinite;
      animation: pulse 1.6s ease-in-out infinite;
    }

    /* 标题文字 */
    #loader-wrapper .load_title {
      position: relative;
      z-index: 2;
      margin-top: 34px;
      font-family: "PingFang SC", "Microsoft YaHei", "Open Sans", sans-serif;
      color: #e6f2ff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 3px;
      text-align: center;
      background: linear-gradient(90deg, #e6f2ff, #4dd0ff, #e6f2ff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-animation: shine 2.6s linear infinite;
      animation: shine 2.6s linear infinite;
    }

    #loader-wrapper .load_sub {
      position: relative;
      z-index: 2;
      margin-top: 10px;
      font-family: "PingFang SC", "Microsoft YaHei", "Open Sans", sans-serif;
      color: #7f9cc4;
      font-size: 13px;
      letter-spacing: 1px;
      text-align: center;
    }

    /* 流光进度条 */
    #loader-wrapper .load_bar {
      position: relative;
      z-index: 2;
      margin-top: 22px;
      width: 240px;
      height: 4px;
      border-radius: 4px;
      overflow: hidden;
      background: rgba(59, 169, 255, 0.15);
      border: 1px solid rgba(90, 160, 255, 0.25);
    }

    #loader-wrapper .load_bar i {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 40%;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, #4dd0ff, #3ba9ff, transparent);
      box-shadow: 0 0 12px rgba(77, 208, 255, 0.8);
      -webkit-animation: slide 1.5s ease-in-out infinite;
      animation: slide 1.5s ease-in-out infinite;
    }

    @-webkit-keyframes spin {
      0% { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
    }

    @keyframes spin {
      0% { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
    }

    @keyframes gridMove {
      from { -webkit-transform: translateY(0); transform: translateY(0); }
      to { -webkit-transform: translateY(42px); transform: translateY(42px); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    @keyframes slide {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    .no-js #loader-wrapper {
      display: none;
    }

    .no-js h1 {
      color: #222222;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div class="loader-bg">
        <div class="loader-grid"></div>
        <span class="loader-glow glow-a"></span>
        <span class="loader-glow glow-b"></span>
      </div>
      <div class="loader-core">
        <div class="loader-ring"></div>
        <div class="loader-ring inner"></div>
        <div class="loader-dot"></div>
      </div>
      <div class="load_title">%VITE_APP_TITLE%</div>
      <div class="load_sub">正在加载系统资源，请耐心等待</div>
      <div class="load_bar"><i></i></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
